# Pulls every 2026-27 game log from stats.nba.com and commits the data.
# Runs on demand and whenever this file changes; the daily schedule is added once the pull is proven here.
name: Daily data update

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/daily-update.yml
      - daily_update.py

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Pull game logs
        run: python daily_update.py
      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nba_2026_27
          git diff --cached --quiet && echo "No new games" || git commit -m "Daily data update"
          git push
